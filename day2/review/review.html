<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- h1을 사용해서 나만의 일본 여행 + 가고싶은 곳 적기 -->
     <h1>삿포로</h1>
     <BR></BR>
     <!-- 이미지 태그를 사용해서 이미지 넣고, a태그로 여행지 링크 달기 -->
    <img src="sapporo.jpeg" alt="">
    <a href="https://kr.hotels.com/go/japan/best-sapporo-things-to-do">삿포로 여행지 BEST 12</a>
    <br>
    <!-- ifame 태그를 사용해서 해당 지도 넣기 -->
    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d2915.1280821976666!2d141.34403857614558!3d43.059773671136476!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zNDPCsDAzJzM1LjIiTiAxNDHCsDIwJzQ3LjgiRQ!5e0!3m2!1sko!2skr!4v1787098016234!5m2!1sko!2skr" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    <!-- h3로 일본어 단어장 만들기 -->
    <h3>はい 하이: 예</h3>
    <h3>いいえ 이-에: 아니오</h3>
    <h3>名前はなんですか 나마에와나안데스카: 이름이 어떻게 되세요?</h3>
    <h3>私は〜です 와타시와 ~데스: 저는 ~입니다</h3>
    <br>
    <!-- input 태그를 여러개 사용해서 플레이스 홀더에 어제 배운 단어 3개 넣기 -->
    <input type="text" placeholder="はい, いいえ, 名前はなんですか">

</body>
</html>
